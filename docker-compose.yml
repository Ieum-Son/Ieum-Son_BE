services:
  mysql:
    image: mysql:8.0
    container_name: ieum-son-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: ieum-son-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql_data: