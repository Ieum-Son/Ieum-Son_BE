spring:
  datasource:
    url: jdbc:h2:mem:ieumson;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  mail:
    username: test@example.com
    password: test-password
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

jwt:
  secret-key: test-secret-key-that-is-at-least-32-bytes-long
  access-token-expiry: 1800000
  refresh-token-expiry: 604800000
  header: Authorization
  prefix: Bearer

ai:
  ticket-secret: test-ticket-secret-that-is-at-least-32-bytes-long

app:
  s3:
    bucket: test-bucket
    region: ap-northeast-2
    profile-image-prefix: profiles
